name: AppImage

# AUTOMATIC CI BUILD DISABLED. The AppImage is now built LOCALLY in a manylinux
# docker container via dist/appimage/build-in-container.sh (the dev box has
# docker), so CI no longer builds/attaches it on release tags — the local build
# is validated end-to-end (incl. the camera-stack 4a gate + a real-camera probe)
# before the .AppImage is uploaded to the release by hand. This workflow is kept
# for manual, clean-room runs only (workflow_dispatch); to restore the old
# tag-triggered behaviour, un-comment the `push:` trigger below.
#
# Build the portable AppImage in a manylinux container so it requires only an
# OLD glibc (2.34) and a GENERIC x86-64 baseline — never the CI/dev host's libc
# or CPU tuning.
on:
  # push:
  #   tags: ['v*']          # DISABLED — the AppImage is built locally via docker
  workflow_dispatch:

jobs:
  appimage:
    runs-on: ubuntu-latest
    # The "Attach to the release" step (gh release upload) needs write access;
    # the default GITHUB_TOKEN is read-only and returns HTTP 403 on upload.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # uv exports the hash-pinned deps from uv.lock on the runner (the
      # manylinux container has no uv) — dist/lock-export.sh, called by:
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      # The same wrapper as the local release build: both variants (normal +
      # verify, with the pinned sha256-checked Helios) INSIDE the digest-pinned
      # manylinux image via `docker run` (rather than the job's `container:`), so
      # the host job keeps node/gh/docker and the bundle's only base is the old
      # container. Helios needs glibc >= 2.39, so the verify AppImage's floor is
      # 2.39 — it's only COPIED into the AppDir, so the 2.34 container is fine.
      - name: Build both AppImages in manylinux_2_34
        run: ./dist/appimage/build-in-container.sh

      - uses: actions/upload-artifact@v4
        with:
          name: qeth-appimage
          path: dist/appimage/out/*.AppImage
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/appimage/out/*.AppImage --clobber
