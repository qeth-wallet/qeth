name: macOS (Apple Silicon)

# Runs the test suite on Apple Silicon and builds the .app bundle. macOS grants
# camera access to BUNDLES, not to a bare `python`, so the bundle is a feature
# prerequisite rather than only a distribution format — and CI is the only
# thing that can verify its recipe, which cannot run on Linux.
#
# macos-15 (and macos-14) are arm64 runners; macos-13 is the Intel one. Public
# repo, so the minutes are free.
#
# Unlike the Linux dev flow this does NOT use --system-site-packages: that
# exists solely to pick up a distro PySide6 so the user's qt6ct/Breeze theme
# applies. macOS has no such system package and Qt's Cocoa platform plugin is
# native, so the PyPI wheel (the `bundled` extra) is the right source here.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'qeth/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'dist/macos/**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'qeth/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'dist/macos/**'

jobs:
  tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Environment
        run: |
          sw_vers
          echo "arch: $(uname -m)"
          uv --version

      # --all-extras covers bundled (PySide6) + simulate + frame + qr; the dev
      # group (pytest, ruff, mypy, hypothesis) comes in by default.
      - name: Install
        run: uv sync --all-extras

      - name: Versions under test
        run: |
          uv run python -c "import sys, platform; print(sys.version); print(platform.platform(), platform.machine())"
          uv run python -c "import PySide6; from PySide6 import QtCore; print('PySide6', PySide6.__version__, 'Qt', QtCore.qVersion())"
          uv run python -c "import qeth; print('qeth', qeth.__version__)"

      # conftest forces QT_QPA_PLATFORM=offscreen before QApplication exists, so
      # no display is needed. Network- and browser-marked tests are deselected
      # by the addopts default.
      - name: Test suite
        run: uv run pytest -q

      # Informational: the same static checks the suite already gates on, run
      # standalone so a failure reads as "lint/types" rather than a test id.
      - name: Ruff
        if: always()
        run: uv run ruff check qeth/ tests/

      - name: mypy
        if: always()
        run: uv run mypy

  # The .app bundle is what makes the camera work at all — macOS won't attach a
  # permission prompt to a bare `python`. Building it here is also the only way
  # this recipe gets verified: it can't run on Linux, so without CI it would rot
  # unnoticed between the maintainer's manual builds.
  bundle:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # The "verify" variant bundles the Helios light client, matching the
      # -verify .deb/.rpm/Flatpak/AppImage. Pinned to the same release those
      # ship (0.11.1) rather than "latest", so a release is reproducible and an
      # upstream change can't silently alter what we distribute.
      - name: Fetch Helios (darwin arm64)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/helios.tar.gz \
            https://github.com/a16z/helios/releases/download/0.11.1/helios_darwin_arm64.tar.gz
          tar -xzf /tmp/helios.tar.gz -C /tmp
          chmod +x /tmp/helios
          /tmp/helios --version

      # Signing is entirely optional: with no secrets configured every step
      # below is skipped and the job produces the same ad-hoc-signed bundles as
      # before. Set MACOS_CERT_P12 (base64 .p12), MACOS_CERT_PASSWORD,
      # APPLE_API_KEY_ID, APPLE_API_ISSUER_ID and APPLE_API_KEY_P8 (base64 .p8)
      # to switch the job to Developer ID + notarization. The secrets are read
      # through env rather than interpolated into the script, so nothing can
      # land in the log.
      - name: Signing configured?
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "${CERT_P12:-}" ] && [ -n "${API_KEY:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing + notarization ENABLED"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets — building ad-hoc signed (not notarized)"
          fi

      - name: Import the Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # A throwaway keychain, so nothing touches the runner's login one.
          KEYCHAIN=$RUNNER_TEMP/qeth-signing.keychain-db
          KEYCHAIN_PW=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign blocks on a GUI prompt that never comes.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in the .p12"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "signing identity: $IDENTITY"

      - name: Build qeth-macos.app
        run: ./dist/macos/build.sh

      - name: Build qeth-verify-macos.app
        run: QETH_BUNDLE_HELIOS=/tmp/helios ./dist/macos/build.sh

      # Re-sign every nested Mach-O with OUR Team ID and enable the hardened
      # runtime, which notarization requires. PyInstaller's own ad-hoc
      # signatures carry no Team ID, so library validation would reject them —
      # see dist/macos/qeth.entitlements for why the exceptions are there.
      - name: Sign the bundles (Developer ID)
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          for APP in dist/macos/out/qeth-macos.app dist/macos/out/qeth-verify-macos.app; do
            codesign --force --deep --options runtime --timestamp \
              --entitlements dist/macos/qeth.entitlements \
              --keychain "$SIGN_KEYCHAIN" --sign "$SIGN_IDENTITY" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            # Gatekeeper still rejects here — the ticket only exists after
            # notarization + stapling below. Informational only.
            spctl -a -vvv -t exec "$APP" 2>&1 | sed "s/^/  spctl: /" || true
          done

      # Assert the bundle carries what the camera actually needs. A build that
      # merely SUCCEEDS proves nothing here: drop NSCameraUsageDescription or
      # the Darwin media plugin and macOS silently refuses the camera, which is
      # the exact failure this whole recipe exists to fix. Every check below
      # therefore EXITS NON-ZERO on absence — an earlier version only printed
      # its findings, and its glob (libqdarwincamera*, a filename that doesn't
      # exist in Qt 6) matched nothing while the step still passed green.
      - name: Verify the bundle
        run: |
          set -euo pipefail
          for APP in dist/macos/out/qeth-macos.app dist/macos/out/qeth-verify-macos.app; do
          test -d "$APP" || { echo "::error::no bundle produced: $APP"; exit 1; }
          PLIST="$APP/Contents/Info.plist"

          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST"

          codesign -d --entitlements - --xml "$APP" 2>/dev/null \
            | grep -q 'com.apple.security.device.camera' \
            || { echo "::error::camera entitlement missing"; exit 1; }
          codesign --verify --deep --strict "$APP"

          # The macOS multimedia backend. Named libdarwinmediaplugin.dylib in
          # Qt 6 — without it QCamera finds no device and the scanner hangs.
          find "$APP" -name 'libdarwinmediaplugin.dylib' | grep -q . \
            || { echo "::error::Darwin media plugin missing"; exit 1; }
          # QR decode, and the seed the token list falls back on.
          find "$APP" -name 'zxingcpp*.so' | grep -q . \
            || { echo "::error::zxingcpp missing"; exit 1; }
          find "$APP" -name 'top_tokens.json' | grep -q . \
            || { echo "::error::bundled top-tokens seed missing"; exit 1; }

          # Pure-Python packages live in the embedded PYZ, not on disk, so
          # check the archive rather than the filesystem: `eth` is py-evm,
          # whose absence would silently cost the pre-broadcast preview.
          uv run --with pyinstaller python -m PyInstaller.utils.cliutils.archive_viewer \
            --list --recursive "$APP/Contents/MacOS/qeth" > /tmp/pyz.txt
          for mod in web3 "eth\." ledgereth; do
            grep -q "'$mod" /tmp/pyz.txt \
              || { echo "::error::$mod not in the bundle"; exit 1; }
          done

          lipo -info "$APP/Contents/MacOS/qeth"

          # helios belongs in the verify bundle and NOWHERE else: a normal
          # build that quietly shipped it would mislabel what users downloaded.
          if [ "$APP" = "dist/macos/out/qeth-verify-macos.app" ]; then
            find "$APP" -name helios -type f | grep -q . \
              || { echo "::error::verify bundle has no helios"; exit 1; }
          else
            find "$APP" -name helios -type f | grep -q . \
              && { echo "::error::helios leaked into the normal bundle"; exit 1; }
          fi
          echo "verified: $APP"
          done

      # Wrap the .app in a disk image BEFORE uploading. actions/upload-artifact
      # zips its path and resolves symlinks doing so, and PyInstaller symlinks
      # Contents/Resources <-> Contents/Frameworks on macOS: uploading the
      # bundle directly produced a 657 MB flattened copy with every symlink
      # replaced by a duplicate file, which invalidates the code signature and
      # gives "damaged and can't be opened". A .dmg is one opaque file to the
      # zip, so the bundle inside it survives byte-for-byte — and it's the
      # format a Mac user expects anyway.
      - name: Package as a disk image
        run: |
          set -euo pipefail
          for v in qeth-macos qeth-verify-macos; do
            hdiutil create -volname "$v" -srcfolder "dist/macos/out/$v.app" \
              -ov -format UDZO "dist/macos/out/$v.dmg"
          done
          ls -lh dist/macos/out/*.dmg

      # Prove the round-trip: mount the image and re-verify the signature of
      # the bundle INSIDE it. That is what a downloader actually runs, and it
      # is exactly the check the raw-directory artifact would have failed.
      - name: Verify the image round-trips
        run: |
          set -euo pipefail
          for v in qeth-macos qeth-verify-macos; do
            MNT=$(mktemp -d)
            hdiutil attach "dist/macos/out/$v.dmg" -mountpoint "$MNT" -nobrowse -quiet
            codesign --verify --deep --strict "$MNT/$v.app"
            find "$MNT/$v.app" -type l | wc -l | xargs echo "$v symlinks preserved:"
            hdiutil detach "$MNT" -quiet
          done
          echo "disk images verified"

      # Notarize the disk images and staple the ticket so it validates offline.
      # notarytool authenticates with an App Store Connect API key — no Apple ID
      # or app-specific password, so nothing interactive.
      - name: Notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          printf '%s' "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/api.p8"
          trap 'rm -f "$RUNNER_TEMP/api.p8"' EXIT
          for v in qeth-macos qeth-verify-macos; do
            DMG="dist/macos/out/$v.dmg"
            # Sign the image itself too, so the container is trusted as well.
            codesign --force --timestamp --keychain "$SIGN_KEYCHAIN" \
              --sign "$SIGN_IDENTITY" "$DMG"
            # --wait blocks until Apple returns a verdict (usually minutes). A
            # rejection fails the step; `notarytool log` names the offending
            # binary, which for a PyInstaller app is usually an entitlement gap.
            xcrun notarytool submit "$DMG" --wait \
              --key "$RUNNER_TEMP/api.p8" --key-id "$API_KEY_ID" \
              --issuer "$API_ISSUER_ID"
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
            # THE check that matters: Gatekeeper must now accept a fresh
            # download. If this rejects, users still see the quarantine wall.
            spctl -a -vvv -t open --context context:primary-signature "$DMG"
            echo "notarized + stapled: $DMG"
          done

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: qeth-macos-dmg
          path: dist/macos/out/*.dmg
          retention-days: 14
          if-no-files-found: error
