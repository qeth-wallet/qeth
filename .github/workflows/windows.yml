name: Windows

# Runs the test suite on real Windows. The day-to-day loop is scripts/wine.sh
# (Windows Python under Wine, same lock); this is the check behind it, since
# Wine can't vouch for everything Windows does (file locking, HID, the tray).
#
# Like macos.yml this uses the PyPI PySide6 wheel (the `bundled` extra) — there
# is no system Qt to inherit on Windows. Python is pinned to scripts/wine.sh's
# default so the two runs test the same interpreter.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'qeth/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'dist/windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'qeth/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'dist/windows/**'

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # --all-extras covers bundled (PySide6) + simulate + frame + qr + trezor;
      # the dev group (pytest, ruff, mypy, hypothesis) comes in by default.
      - name: Install
        run: uv sync --all-extras --python 3.14

      - name: Versions under test
        run: |
          uv run python -c "import sys, platform; print(sys.version); print(platform.platform(), platform.machine())"
          uv run python -c "import PySide6; from PySide6 import QtCore; print('PySide6', PySide6.__version__, 'Qt', QtCore.qVersion())"
          uv run python -c "import qeth; print('qeth', qeth.__version__)"

      # conftest forces QT_QPA_PLATFORM=offscreen (and, on Windows, points the
      # offscreen font database at %WINDIR%\Fonts). Network- and browser-marked
      # tests are deselected by the addopts default.
      - name: Test suite
        run: uv run pytest -q

      # Informational: the same static checks the suite already gates on, run
      # standalone so a failure reads as "lint/types" rather than a test id.
      # mypy here checks the win32 platform branches the Linux run can't.
      - name: Ruff
        if: always()
        run: uv run ruff check qeth/ tests/

      - name: mypy
        if: always()
        run: uv run mypy

  # The PyInstaller onedir build, verified by RUNNING it: a frozen bundle's
  # usual failure is a module or DLL the analysis missed, which only shows at
  # launch. Locally, `scripts/wine.sh build` runs the same recipe under Wine.
  bundle:
    runs-on: windows-2025
    env:
      UV_PYTHON: "3.14"   # what the test job runs; PySide6 6.12 + 3.15 needs a workaround
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Build qeth-windows
        run: ./dist/windows/build.sh

      - name: Verify the bundle
        run: |
          set -euo pipefail
          D=dist/windows/out/qeth-windows
          test -f "$D/qeth.exe" || { echo "::error::no qeth.exe"; exit 1; }
          for f in qwindows.dll ffmpegmediaplugin.dll 'zxingcpp*.pyd' 'hid*.pyd' \
                   libusb-1.0.dll top_tokens.json; do
            find "$D" -name "$f" | grep -q . \
              || { echo "::error::$f missing from the bundle"; exit 1; }
          done
          uv run --no-project --with pyinstaller python -m PyInstaller.utils.cliutils.archive_viewer \
            --list --recursive "$D/qeth.exe" > "$RUNNER_TEMP/pyz.txt"
          for mod in web3 "eth\." ledgereth trezorlib; do
            grep -q "'$mod" "$RUNNER_TEMP/pyz.txt" \
              || { echo "::error::$mod not in the bundle"; exit 1; }
          done
          du -sh "$D"

      # Launch the real exe (dist/windows/smoke.sh): the RPC server answering
      # proves the frozen interpreter, Qt's windows platform plugin
      # (QApplication comes first) and the aiohttp stack load; the main
      # window, still up 15 s later, covers the rest of startup.
      - name: Smoke-run qeth.exe
        run: ./dist/windows/smoke.sh ./dist/windows/out/qeth-windows/qeth.exe

      - name: Zip the bundle
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' qeth/__init__.py)
          cd dist/windows/out
          7z a -tzip -mx=9 "qeth-$ver-windows-x64.zip" qeth-windows > /dev/null
          ls -lh ./*.zip

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: qeth-windows-zip
          path: dist/windows/out/*.zip
          retention-days: 14
          if-no-files-found: error

      # Pinned, like every other fetched tool (same release as scripts/wine.sh);
      # the digest is GitHub's for that asset.
      - name: Install Inno Setup
        run: |
          set -euo pipefail
          v=6.7.3
          exe=innosetup-$v.exe
          curl -fsSL -o "$RUNNER_TEMP/$exe" \
            "https://github.com/jrsoftware/issrc/releases/download/is-${v//./_}/$exe"
          echo "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732  $RUNNER_TEMP/$exe" \
            | sha256sum -c -
          MSYS2_ARG_CONV_EXCL='*' "$RUNNER_TEMP/$exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART \
            "/DIR=$(cygpath -w "$RUNNER_TEMP/innosetup")"
          test -f "$RUNNER_TEMP/innosetup/ISCC.exe"
          echo "ISCC=$(cygpath -w "$RUNNER_TEMP/innosetup/ISCC.exe")" >> "$GITHUB_ENV"

      - name: Build the installer
        run: ./dist/windows/installer.sh

      # The installer the way a user meets it: silent per-user install → Start
      # menu entry + uninstall registration → the INSTALLED qeth.exe runs →
      # uninstall removes the whole folder.
      - name: Install, run, uninstall
        run: |
          set -euo pipefail
          export MSYS2_ARG_CONV_EXCL='*'
          setup=$(ls dist/windows/out/qeth-*-setup.exe)
          appid=$(sed -n 's/^AppId={{\(.*\)}$/\1/p' dist/windows/qeth.iss)
          ls -lh "$setup"
          "$setup" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER
          app="$(cygpath -u "$LOCALAPPDATA")/Programs/qeth"
          test -f "$app/qeth.exe" \
            || { echo "::error::nothing installed in %LOCALAPPDATA%\\Programs\\qeth"; exit 1; }
          test -f "$(cygpath -u "$APPDATA")/Microsoft/Windows/Start Menu/Programs/qeth.lnk" \
            || { echo "::error::no Start-menu entry"; exit 1; }
          reg query "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\{$appid}_is1" /v DisplayVersion
          ./dist/windows/smoke.sh "$app/qeth.exe"
          # The uninstaller re-launches itself from %TEMP% and returns at once;
          # that copy removes unins000.exe and the folder last.
          "$app/unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          for i in $(seq 60); do [ -e "$app" ] || break; sleep 1; done
          [ ! -e "$app" ] || { echo "::error::uninstalling left: $(ls "$app")"; exit 1; }
          echo "installed, ran and uninstalled cleanly"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: qeth-windows-setup
          path: dist/windows/out/*-setup.exe
          retention-days: 14
          if-no-files-found: error
